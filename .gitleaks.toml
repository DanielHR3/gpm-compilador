# Reglas de gitleaks para un repositorio PUBLICO. Se extienden las reglas por
# omision (llaves de AWS, JWT, tokens de GitHub...) con lo propio del despliegue:
# lo que vive en scripts/aws/estado.env y no debe aparecer en ningun commit.
# Los codigos SEG-0x NO se vigilan: el repo los cita a proposito como etiquetas
# de riesgo; lo privado es el detalle del hallazgo, que vive en la boveda.
title = "gpm-compilador"

[extend]
useDefault = true

[[rules]]
id = "gpmc-cadena-de-conexion"
description = "Cadena de conexion de base de datos con contrasena"
regex = '''postgres(?:ql)?://[^:\s/]+:([^@\s]{6,})@'''
secretGroup = 1
keywords = ["postgres"]

[[rules]]
id = "gpmc-variable-secreta"
description = "Variable secreta del despliegue con valor literal"
regex = '''(?:GPMC_JWT_SECRETO?|GPMC_SMTP_CLAVE|GPMC_IA_LLAVE|BD_CLAVE)\s*=\s*["']?([A-Za-z0-9+/=_\-]{12,})'''
secretGroup = 1
keywords = ["gpmc_jwt_secret", "gpmc_smtp_clave", "gpmc_ia_llave", "bd_clave"]

[[rules]]
id = "gpmc-infraestructura-aws"
description = "Identificador de la infraestructura de AWS (cuenta, IP del EC2, host de RDS)"
regex = '''(126514370699|78\.14\.76\.164|gpmc-bd\.[a-z0-9]+\.[a-z0-9-]+\.rds\.amazonaws\.com)'''
keywords = ["126514370699", "78.14.76.164", "rds.amazonaws.com"]

[allowlist]
description = "Ejemplos y marcadores, no secretos"
regexes = ['''(?i)(cambiame|ejemplo|xxxx|<[a-z_]+>|\$\{?[A-Z_]+\}?)''']
paths = ['''frontend/package-lock\.json''']
