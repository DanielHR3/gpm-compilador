[project]
name = "gpmc"
version = "0.1.0"
description = "Compilador de tramites para la plataforma GPM"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.13", "pyyaml>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pypdf>=4.0", "psycopg[binary]>=3.2"]
guia = ["reportlab>=4.0"]
agentes = ["google-genai>=1.0", "openai>=1.40"]
# Solo del desarrollador: revision de secretos antes del commit y borrador de la bitacora.
dev = ["pre-commit>=3.5", "git-cliff>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpmc.web" = ["plantilla-diccionario.md", "plantilla-tobe.md"]
"gpmc.agentes" = ["ejemplos/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["red: llama a un proveedor real; se salta salvo GPMC_IA_PRUEBA_REAL=1"]

[project.scripts]
gpmc = "gpmc.cli:main"
